name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: flake8
        run: flake8 nos tests
      - name: mypy
        run: mypy nos
      - name: black (check only)
        run: black --check nos tests
      - name: isort (check only)
        run: isort --check-only nos tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=nos --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  # The generated nodes are imported against a real rclpy, with ROS sourced.
  ros:
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install NOS
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-pip
          pip3 install -e ".[dev]"
      - name: Tests with ROS 2 sourced
        shell: bash
        env:
          # ROS ships pytest plugins (launch_testing, ...) that need extra packages
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          source /opt/ros/humble/setup.bash
          pytest -p no:cacheprovider
      - name: Compile and import a generated node against the real rclpy
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          nos tests/fixtures/publisher.node -o /tmp/out --no-build
          cd /tmp/out/ros2_ws/src/demo_pub
          python3 -c "import demo_pub.talker_node as m; print('imported', m.TalkerBase)"
          colcon --help >/dev/null 2>&1 || apt-get install -y python3-colcon-common-extensions
          cd /tmp/out/ros2_ws && colcon build --packages-select demo_pub

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/nos --version
          /tmp/venv/bin/nos --help > /dev/null
          /tmp/venv/bin/nos-codeblock --help 2>/dev/null || true
      - name: Wheel contains the grammar, editor page and VS Code extension
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needle in (
              "nos/grammar/NOSParser.g4",
              "nos/grammar/NOSLexer.g4",
              "nos/codeblock/static/index.html",
              "nos/extensions/vscode-nos/package.json",
              "nos/extensions/vscode-nos/syntaxes/nos.tmLanguage.json",
          ):
              assert needle in names, f"missing from wheel: {needle}"
          PY
      - name: Compile an example from the installed wheel
        run: |
          /tmp/venv/bin/nos tests/fixtures/publisher.node -o /tmp/out --no-build
          test -f /tmp/out/ros2_ws/src/demo_pub/package.xml
